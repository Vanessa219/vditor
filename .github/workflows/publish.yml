name: Publish packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Vanessa219/vditor'
    name: Publish to ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: npmjs
            registry: https://registry.npmjs.org
            scope: ""
          - target: GitHub Packages
            registry: https://npm.pkg.github.com
            scope: "@vanessa219"
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: ${{ matrix.registry }}
          scope: ${{ matrix.scope }}
          package-manager-cache: false

      - name: Validate release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node <<'NODE'
          const {version} = require("./package.json");
          const tag = process.env.RELEASE_TAG;
          if (tag !== version && tag !== `v${version}`) {
              throw new Error(`Release tag ${tag} does not match package version ${version}`);
          }
          if (version.includes("-") !== (process.env.RELEASE_PRERELEASE === "true")) {
              throw new Error("Release prerelease status does not match package version");
          }
          NODE

      - name: Install pnpm
        run: npm install --global pnpm@12.6.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Configure GitHub package name
        if: matrix.target == 'GitHub Packages'
        run: npm pkg set name=@vanessa219/vditor

      - name: Inspect package
        run: npm pack --dry-run

      - name: Publish to npmjs
        if: matrix.target == 'npmjs'
        shell: bash
        run: |
          TAG=$(node -p "require('./package.json').version.includes('-') ? 'alpha' : 'latest'")
          npm publish --registry https://registry.npmjs.org --tag "$TAG"

      - name: Publish to GitHub Packages
        if: matrix.target == 'GitHub Packages'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(node -p "require('./package.json').version.includes('-') ? 'alpha' : 'latest'")
          npm publish --registry https://npm.pkg.github.com --tag "$TAG"
